version: "3.9"

services:
  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monitor-de-precios-scraper
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    command: ["python", "-m", "monitor_de_precios.cli.main", "scheduler"]

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monitor-de-precios-ui
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "8501:8501"
    restart: unless-stopped
    command: ["python", "-m", "monitor_de_precios.cli.main", "serve"]