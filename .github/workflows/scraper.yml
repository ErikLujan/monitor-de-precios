name: Daily Scraper

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv cache
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install deps
        run: uv sync --frozen

      - name: Create products configuration
        env:
          PRODUCTS_YAML: ${{ secrets.PRODUCTS_YAML }}
        run: |
          if [ -z "$PRODUCTS_YAML" ]; then
            echo "::error::PRODUCTS_YAML secret is not configured"
            exit 1
          fi

          printf '%s' "$PRODUCTS_YAML" > products.yaml

      - name: Run scraper
        env:
            TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
            WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: uv run python -m monitor_de_precios.cli.main scrape

      - name: Commit DB changes
        run: |
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f data/precios.db
            git diff --staged --quiet || git commit -m "chore: update prices DB [skip ci]"
            git push
